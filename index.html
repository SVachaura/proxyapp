<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>ProxyApp</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:
    radial-gradient(circle at 50% 20%,#1f6fff 0%,#0d3fa8 35%,#061d52 75%);
  color:white;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:430px;
  min-height:100vh;
  margin:auto;
  padding:24px 20px 18px;
  display:flex;
  flex-direction:column;
}

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:900;
  letter-spacing:-1px;
}

.settings{
  width:44px;
  height:44px;
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;
  background:rgba(255,255,255,.1);
  color:white;
  font-size:20px;
  cursor:pointer;
  backdrop-filter:blur(10px);
}

.center{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
}

.status{
  font-size:14px;
  font-weight:800;
  letter-spacing:1px;
  margin-bottom:24px;
  opacity:.9;
}

.connect{
  width:220px;
  height:220px;
  border-radius:50%;
  border:7px solid rgba(255,255,255,.9);
  background:linear-gradient(145deg,#fff,#d9e8ff);
  color:#0753d6;
  font-size:21px;
  font-weight:900;
  cursor:pointer;
  box-shadow:
    0 0 0 10px rgba(255,255,255,.08),
    0 20px 60px rgba(0,0,0,.3);
  transition:.2s;
}

.connect:active{
  transform:scale(.94);
}

.connect.connected{
  background:#0875ff;
  color:white;
  border-color:#fff;
  box-shadow:
    0 0 0 10px rgba(255,255,255,.1),
    0 0 45px rgba(0,140,255,.8);
}

.server{
  width:100%;
  margin-top:40px;
  padding:17px;
  border:1px solid rgba(255,255,255,.2);
  border-radius:18px;
  background:rgba(255,255,255,.1);
  backdrop-filter:blur(15px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  transition:.2s;
}

.server:active{
  transform:scale(.98);
}

.server-left{
  display:flex;
  align-items:center;
  gap:13px;
}

.flag{
  width:42px;
  height:42px;
  border-radius:12px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:rgba(255,255,255,.15);
  font-size:23px;
}

.server-title{
  font-weight:900;
  font-size:16px;
}

.server-name{
  margin-top:4px;
  font-size:13px;
  opacity:.65;
}

.arrow{
  font-size:28px;
  opacity:.8;
}

.footer{
  text-align:center;
  font-size:12px;
  opacity:.45;
  padding-top:15px;
}

/* SERVER MENU */

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,10,35,.65);
  backdrop-filter:blur(8px);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:10;
}

.overlay.show{
  display:flex;
}

.server-menu{
  width:100%;
  max-width:430px;
  background:#071d4d;
  border-radius:25px 25px 0 0;
  padding:22px 20px 30px;
  box-shadow:0 -20px 60px rgba(0,0,0,.35);
}

.menu-title{
  font-size:20px;
  font-weight:900;
  margin-bottom:16px;
}

.server-option{
  width:100%;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.07);
  color:white;
  padding:15px;
  margin-top:10px;
  border-radius:15px;
  display:flex;
  align-items:center;
  gap:13px;
  text-align:left;
  cursor:pointer;
}

.server-option:active{
  background:rgba(255,255,255,.16);
}

.option-flag{
  font-size:25px;
}

.option-info{
  flex:1;
}

.option-title{
  font-weight:800;
}

.option-location{
  font-size:12px;
  opacity:.55;
  margin-top:3px;
}

.check{
  font-size:20px;
  display:none;
}

.server-option.active .check{
  display:block;
}

.close{
  width:100%;
  margin-top:18px;
  padding:15px;
  border:0;
  border-radius:15px;
  background:white;
  color:#0753d6;
  font-weight:900;
  cursor:pointer;
}

@media(max-height:650px){
  .connect{
    width:175px;
    height:175px;
  }

  .server{
    margin-top:25px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="logo">ProxyApp</div>

    <button class="settings" onclick="openSettings()">
      ⚙
    </button>
  </div>

  <div class="center">

    <div class="status" id="status">
      НЕ ПОДКЛЮЧЕНО
    </div>

    <button class="connect" id="connect">
      ПОДКЛЮЧИТЬ
    </button>

    <div class="server" onclick="openServers()">

      <div class="server-left">

        <div class="flag" id="currentFlag">
          🇷🇺
        </div>

        <div>
          <div class="server-title">
            Сервер
          </div>

          <div class="server-name" id="currentServer">
            AllVPN — Россия
          </div>
        </div>

      </div>

      <div class="arrow">
        ›
      </div>

    </div>

  </div>

  <div class="footer">
    ProxyApp
  </div>

</div>


<!-- SERVER MENU -->

<div class="overlay" id="overlay">

  <div class="server-menu">

    <div class="menu-title">
      Выберите сервер
    </div>


    <button class="server-option active"
            onclick="selectServer('🇷🇺','AllVPN — Россия',this)">

      <div class="option-flag">🇷🇺</div>

      <div class="option-info">
        <div class="option-title">AllVPN — Россия</div>
        <div class="option-location">Россия</div>
      </div>

      <div class="check">✓</div>

    </button>


    <button class="server-option"
            onclick="selectServer('🇩🇪','AllVPN — Германия',this)">

      <div class="option-flag">🇩🇪</div>

      <div class="option-info">
        <div class="option-title">AllVPN — Германия</div>
        <div class="option-location">Германия</div>
      </div>

      <div class="check">✓</div>

    </button>


    <button class="server-option"
            onclick="selectServer('🇳🇱','AllVPN — Нидерланды',this)">

      <div class="option-flag">🇳🇱</div>

      <div class="option-info">
        <div class="option-title">AllVPN — Нидерланды</div>
        <div class="option-location">Нидерланды</div>
      </div>

      <div class="check">✓</div>

    </button>


    <button class="server-option"
            onclick="selectServer('🇺🇸','AllVPN — США',this)">

      <div class="option-flag">🇺🇸</div>

      <div class="option-info">
        <div class="option-title">AllVPN — США</div>
        <div class="option-location">США</div>
      </div>

      <div class="check">✓</div>

    </button>


    <button class="close" onclick="closeServers()">
      ГОТОВО
    </button>

  </div>

</div>


<script>

const button = document.getElementById("connect");
const status = document.getElementById("status");

let connected = false;


/* CONNECT */

button.addEventListener("click", () => {

  connected = !connected;

  if(connected){

    status.textContent = "ПОДКЛЮЧЕНО";

    button.textContent = "ОТКЛЮЧИТЬ";

    button.classList.add("connected");

  }else{

    status.textContent = "НЕ ПОДКЛЮЧЕНО";

    button.textContent = "ПОДКЛЮЧИТЬ";

    button.classList.remove("connected");

  }

});


/* SERVERS */

function openServers(){

  document.getElementById("overlay")
    .classList.add("show");

}

function closeServers(){

  document.getElementById("overlay")
    .classList.remove("show");

}

function selectServer(flag,name,element){

  document.getElementById("currentFlag")
    .textContent = flag;

  document.getElementById("currentServer")
    .textContent = name;

  document.querySelectorAll(".server-option")
    .forEach(item => item.classList.remove("active"));

  element.classList.add("active");

  closeServers();

}


/* SETTINGS */

function openSettings(){

  alert("Настройки ProxyApp будут добавлены позже.");

}


/* CLOSE MENU BY BACKGROUND */

document.getElementById("overlay").addEventListener("click",(event)=>{

  if(event.target.id === "overlay"){
    closeServers();
  }

});

</script>

</body>
</html>
